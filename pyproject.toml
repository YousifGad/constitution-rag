[project]
name = "constitution-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.161.1",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
constitution-rag = "constitution_rag:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
